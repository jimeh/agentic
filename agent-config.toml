#:schema ./schemas/agent-config.schema.json

symlinks = [
  { source = "generated/CLAUDE.md", target = "~/.claude/CLAUDE.md", relinkFrom = [
    "RULES.md",
  ] },
  { source = "generated/CODEX.md", target = "~/.codex/AGENTS.md" },
  { source = "generated/OPENCODE.md", target = "~/.config/opencode/AGENTS.md" },
  { source = "claude/settings.json", target = "~/.claude/settings.json" },
  { source = "claude/keybindings.json", target = "~/.claude/keybindings.json" },
  { source = "claude/statusline.sh", target = "~/.claude/statusline.sh" },
  { source = "codex/config.toml", target = "~/.codex/config.toml" },
  { source = "codex/hooks.json", target = "~/.codex/hooks.json" },
  { source = "codex/pets", target = "~/.codex/pets" },
  { source = "bin/clide", target = "~/.local/bin/clide" },
  { source = "bin/claudex", target = "~/.local/bin/claudex" },
  { source = "bin/fable", target = "~/.local/bin/fable" },
  { source = "bin/opus", target = "~/.local/bin/opus" },
  { source = "packages/claude-headless/bin/claude-headless.ts", target = "~/.local/bin/claude-headless", relinkFrom = [
    "packages/agent-config/bin/claude-headless.ts",
  ] },
  { source = "packages/codex-headless/bin/codex-headless.ts", target = "~/.local/bin/codex-headless" },
  { source = "packages/agent-pr-monitor/bin/agent-pr-monitor.ts", target = "~/.local/bin/agent-pr-monitor" },
]

staleSymlinkCleanup = [
  { sourceDir = "generated", targetDir = "~/.agents" },
  { sourceDir = "rules/rtk", targetDir = "~/.claude" },
  { sourceDir = "rules/rtk", targetDir = "~/.codex" },
  { sourceDir = "bin", targetDir = "~/.local/bin" },
  { sourceDir = "claude/commands", targetDir = "~/.claude/commands" },
  { sourceDir = "claude/agents", targetDir = "~/.claude/agents" },
  { sourceDir = "skills", targetDir = "~/.claude/skills" },
  { sourceDir = "skills", targetDir = "~/.agents/skills" },
  { sourceDir = "thirdparty/skills", targetDir = "~/.claude/skills" },
  { sourceDir = "thirdparty/skills", targetDir = "~/.agents/skills" },
]

# Bounded CLI workers are shared. Session modes and computer-use handoffs
# remain directional; unused skills stay in source without resident descriptions.
[[skillSymlinks]]
sourceRoot = "skills"
exclude = [
  "codex-first",
  "claude-first",
  "codex-computer-use",
  "frontend-design-systems",
  "multi-agent-execution",
  "vuln-scan-orchestrator",
  "react-high-performance",
]
targetRoots = ["~/.claude/skills", "~/.agents/skills"]

[[skillSymlinks]]
sourceRoot = "skills"
only = ["codex-first", "codex-computer-use", "multi-agent-execution"]
targetRoots = ["~/.claude/skills"]

[[skillSymlinks]]
sourceRoot = "skills"
only = ["claude-first"]
targetRoots = ["~/.agents/skills"]

[[skillSymlinks]]
sourceRoot = "thirdparty/skills"
exclude = ["unslop"]
targetRoots = ["~/.claude/skills", "~/.agents/skills"]

[claude]
marketplaces = [
  { name = "claude-plugins-official", source = "anthropics/claude-plugins-official" },
]

plugins = []
