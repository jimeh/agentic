#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
suppress_unstable_features_warning = true
web_search = "live"
approvals_reviewer = "auto_review"
service_tier = "default"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
hooks = true
apply_patch_freeform = true
multi_agent = true
runtime_metrics = true
shell_snapshot = true
unified_exec = true
memories = true
js_repl = false

[notice]
[notice.model_migrations]
"gpt-5.2" = "gpt-5.2-codex"

[plugins]
[plugins."github@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."coderabbit@openai-curated"]
enabled = true

[plugins."codex-security@openai-curated"]
enabled = true

[plugins."remotion@openai-curated"]
enabled = true

[plugins."cloudflare@openai-curated"]
enabled = true

[plugins."convex@openai-curated"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."build-macos-apps@openai-curated"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."build-web-apps@openai-curated"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[[skills.config]]
name = "build-web-apps:supabase-postgres-best-practices"
enabled = false

[[skills.config]]
name = "build-web-apps:stripe-best-practices"
enabled = false

[mcp_servers]
[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

[mcp_servers.codegraph.tools.codegraph_explore]
approval_mode = "approve"

[mcp_servers.deepwiki]
enabled = true
url = "https://mcp.deepwiki.com/mcp"

[mcp_servers.deepwiki.tools.read_wiki_structure]
approval_mode = "approve"

[mcp_servers.deepwiki.tools.ask_question]
approval_mode = "approve"

[desktop]
appearanceDarkCodeThemeId = "codex"
usePointerCursors = false
followUpQueueMode = "queue"
reviewDelivery = "inline"
git-always-force-push = false
git-show-sidebar-pr-icons = true
conversationDetailMode = "STEPS_COMMANDS"
preventSleepWhileRunning = true
selected-avatar-id = "rocky"
dictationDictionary = ["Hucode"]
avatar-overlay-mascot-width-px = 80
dock-icon-preference = "app-default"
show-context-window-usage = true

[desktop.appearanceLightChromeTheme]
accent = "#339cff"
contrast = 45
ink = "#1a1c1f"
opaqueWindows = false
surface = "#ffffff"

[desktop.appearanceLightChromeTheme.fonts]
code = """'Menlo Nerd Font Mono', "Geist Mono", ui-monospace, "SFMono-Regular""""
ui = "Geist, Inter"

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#ba2623"
skill = "#924ff7"

[desktop.appearanceDarkChromeTheme]
accent = "#339cff"
contrast = 50
ink = "#ffffff"
opaqueWindows = false
surface = "#181818"

[desktop.appearanceDarkChromeTheme.fonts]
code = """'Menlo Nerd Font Mono', "Geist Mono", ui-monospace, "SFMono-Regular""""
ui = "Geist, Inter"

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#00a240"
diffRemoved = "#e02e2a"
skill = "#b06dff"

[desktop.open-in-target-preferences]
global = "vscode"

[memories]
generate_memories = true
use_memories = true
