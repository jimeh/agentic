[[skills.config]]
name = "build-web-apps:supabase-postgres-best-practices"
enabled = false

[[skills.config]]
name = "build-web-apps:stripe-best-practices"
enabled = false

[mcp_servers]
[mcp_servers.deepwiki]
enabled = true
url = "https://mcp.deepwiki.com/mcp"

[mcp_servers.deepwiki.tools.read_wiki_structure]
approval_mode = "approve"

[mcp_servers.deepwiki.tools.ask_question]
approval_mode = "approve"

[mcp_servers.gitnexus]
enabled = true
command = 'mise'
args = ['x', 'npm:gitnexus', '--', 'gitnexus', 'mcp']

