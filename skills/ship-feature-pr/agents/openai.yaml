interface:
  display_name: "Ship Feature PR"
  short_description: "Reuse or plan, implement, and review a feature PR"
  default_prompt:
    "Use $ship-feature-pr to ship this feature from the current checkout: reuse
    or create a concise closure plan, assign validation evidence once, open a
    draft PR, run dual inspection-first review, batch each correction cycle into
    one push, carry valid evidence and reviewer acceptance across narrow deltas,
    and mark it ready only when both reviewers and required CI cover the final
    head and handback and cleanup pass."
